name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            profile/pnpm-lock.yaml
            shevery/pnpm-lock.yaml

      - name: Build profile (site root)
        working-directory: profile
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Shevery (mounted at /shevery)
        working-directory: shevery
        env:
          BASE_PATH: /shevery
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble site
        run: |
          mkdir site
          cp -r profile/out/. site/
          mkdir site/shevery
          cp -r shevery/out/. site/shevery/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
